services:
  dev:
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    # Limit the maximum number of opened files per application
    # as Docker's default (~1G) overflows unsquashfs 4.5
    ulimits:
      nofile:
        soft: 1024000
        hard: 1024000
    volumes:
      - ${HOME}:${HOME}:cached
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent:ro
    environment:
      - VCPKG_ROOT=${VCPKG_ROOT}
      # Empty value means "full core count"
      - CMAKE_BUILD_PARALLEL_LEVEL=
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK:+/ssh-agent}
